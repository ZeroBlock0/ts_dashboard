name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送标签触发，例如 v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: macos-latest
            script: ./build_nuitka.sh
            asset_name: "dist_nuitka/TS_Dashboard_macOS.dmg"
          - os: windows-latest
            script: build_nuitka.bat
            asset_name: "dist_nuitka/TS_Dashboard.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Build Script
        run: |
          chmod +x ./build_nuitka.sh
          ${{ matrix.script }}
        shell: bash

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

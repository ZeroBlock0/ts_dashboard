name: Build macOS App with Nuitka

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true  # 开启缓存，让下次构建更快

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Build Script
      run: |
        # 确保脚本有执行权限
        chmod +x ./your_script_name.sh
        # 执行脚本
        ./your_script_name.sh
      shell: bash

    - name: Upload App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: TS-Dashboard-macOS
        # Nuitka 输出的是目录，包含 .app 文件夹
        path: dist_nuitka/*.app

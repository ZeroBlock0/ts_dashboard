name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      version: ${{ steps.semantic.outputs.version }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release

      - name: Semantic Release
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check version
          try_version=$(semantic-release version --print || echo "")
          
          if [ -z "$try_version" ]; then
            echo "No release needed."
            echo "released=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Releasing version $try_version"
          echo "released=true" >> $GITHUB_OUTPUT
          echo "version=$try_version" >> $GITHUB_OUTPUT
          echo "tag=v$try_version" >> $GITHUB_OUTPUT
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          semantic-release version
          semantic-release publish

  build:
    name: Build on ${{ matrix.os }}
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            shell: cmd
            script: build_nuitka.bat
            artifact_name: TS_Dashboard.exe
            asset_path: dist_nuitka/TS_Dashboard.exe
            content_type: application/vnd.microsoft.portable-executable
          
          # - os: macos-latest
          #   shell: bash
          #   script: ./build_nuitka.sh
          #   artifact_name: TS_Dashboard_macOS.zip
          #   asset_path: dist_nuitka/TS_Dashboard_macOS.zip
          #   content_type: application/zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Application
        shell: ${{ matrix.shell }}
        run: ${{ matrix.script }}
        env:
          NUITKA_CACHE_DISABLE: "1"
          VERSION: ${{ needs.release.outputs.version }}

      - name: Package macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd dist_nuitka
          # build_nuitka.sh creates TS_Dashboard.app
          zip -r TS_Dashboard_macOS.zip "TS Dashboard.app"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
          tag_name: ${{ needs.release.outputs.tag }}

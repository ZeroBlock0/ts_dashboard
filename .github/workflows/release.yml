name: Build and Release

on:
  push:
    branches:
      - main           # 合并到 main 时触发自动打 Tag 和发布
    tags:
      - 'v*'           # 手动推送标签时触发
  pull_request:
    branches:
      - main           # PR 时触发构建检查
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write 

    strategy:
      matrix:
        include:
          - os: windows-latest
            script: .\build_nuitka.bat
            asset_pattern: "dist_nuitka/TS_Dashboard.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以计算版本号

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- 新增：自动计算并同步版本号 ---
      - name: Sync and Generate Version
        id: version_logic
        shell: pwsh
        run: |
          # 获取当前最新标签
          $latestTag = git describe --tags --abbrev=0 2>$null
          if ($null -eq $latestTag) { $latestTag = "v1.0.0" }
          
          # 如果是 PR 阶段，不增加版本号，仅读取当前版本
          # 如果是 Push 到 main，则计算下一个版本
          $newTag = $latestTag
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
              $version = $latestTag.TrimStart('v')
              $parts = $version.Split('.')
              $parts[2] = [int]$parts[2] + 1
              $newTag = "v" + ($parts -join '.')
          }
          
          # 同步到 _version.py 供 Nuitka 读取 [cite: 4, 5]
          $cleanVer = $newTag.TrimStart('v')
          "__version__ = '$cleanVer'" | Out-File -Encoding ascii _version.py
          
          echo "tag=$newTag" >> $env:GITHUB_OUTPUT
          echo "Using Version: $newTag"

      - name: Run Build Script
        run: ${{ matrix.script }}
        env:
          NUITKA_CACHE_DISABLE: "1"

      # 将新的版本号回写到 main 分支，避免本地与发布版本不一致
      - name: Commit version bump back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $tag = "${{ steps.version_logic.outputs.tag }}"
          $ver = $tag.TrimStart('v')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _version.py
          # 使用 [skip ci] 避免该提交再次触发工作流
          git commit -m "chore: bump version to $ver [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

      # --- 只有合并到 main 时才打新 Tag ---
      - name: Push New Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $tag = "${{ steps.version_logic.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag

      # --- 发布 Release ---
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_pattern }}
          tag_name: ${{ steps.version_logic.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true

name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送标签时触发
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: macos-latest
            script: ./build_nuitka.sh
            asset_pattern: "dist_nuitka/*.dmg"
            shell_type: bash  # 新增：指定 Mac 使用 bash
          - os: windows-latest
            script: build_nuitka.bat
            asset_pattern: "dist_nuitka/TS_Dashboard.exe"
            shell_type: cmd   # 新增：指定 Win 使用 cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Build Script
        # 使用 matrix 动态切换 shell，解决 "command not found" 问题
        shell: ${{ matrix.shell_type }}
        run: |
          # 仅在 macOS 下执行权限赋予
          if "${{ matrix.os }}" == "macos-latest" ( chmod +x ./build_nuitka.sh )
          ${{ matrix.script }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_pattern }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
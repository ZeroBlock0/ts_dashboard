name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送标签时触发工作流
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: macos-latest
            script: ./build_nuitka.sh
            asset_pattern: "dist_nuitka/*.dmg"
          - os: windows-latest
            script: .\build_nuitka.bat
            asset_pattern: "dist_nuitka/TS_Dashboard.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Grant permissions (macOS)
        if: runner.os == 'macOS'
        run: chmod +x ./build_nuitka.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # 增加可用文件描述符
          ulimit -n 10240

      - name: Run Build Script
        run: ${{ matrix.script }}
        env:
          NUITKA_CACHE_DISABLE: "1"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_pattern }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

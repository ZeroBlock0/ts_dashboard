name: Build and Release

on:
  push:
    branches:
      - main           # 合并到 main 时触发自动打 Tag 和发布
    tags:
      - 'v*'           # 手动推送标签时触发
  pull_request:
    branches:
      - main           # PR 时触发构建检查
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write 

    strategy:
      matrix:
        include:
          - os: windows-latest
            script: .\build_nuitka.bat
            asset_pattern: "dist_nuitka/TS_Dashboard.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以计算版本号

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- 读取版本，不再自动 +1，需在代码中维护 _version.py ---
      - name: Read Version
        id: version_logic
        shell: pwsh
        run: |
          $line = Get-Content _version.py | Where-Object { $_ -match "__version__" }
          if (-not $line) { Write-Error "_version.py 中缺少 __version__"; exit 1 }
          if ($line -match "['\"]([0-9]+\.[0-9]+\.[0-9]+)['\"]") {
            $ver = $Matches[1]
          } else {
            Write-Error "无法解析版本号: $line"; exit 1
          }

          # 推送 tag 的场景，优先使用 ref 中的 tag
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          } else {
            $tag = "v$ver"
          }

          # 如果是 push main，检查 tag 是否已存在
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            $exists = git tag --list $tag
            if ($exists) { Write-Error "Tag $tag 已存在，请先更新 _version.py"; exit 1 }
          }

          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Using Version: $ver (tag: $tag)"

      - name: Run Build Script
        run: ${{ matrix.script }}
        env:
          NUITKA_CACHE_DISABLE: "1"

      # --- 只有合并到 main 时才打新 Tag ---
      - name: Push New Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $tag = "${{ steps.version_logic.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag

      # --- 发布 Release ---
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_pattern }}
          tag_name: ${{ steps.version_logic.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true

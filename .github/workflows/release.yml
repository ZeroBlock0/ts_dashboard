name: Build and Release

on:
  push:
    branches:
      - main           # 合并到 main 时触发自动打 Tag 和发布
    tags:
      - 'v*'           # 手动推送 v 开头的标签时也触发
  pull_request:
    branches:
      - main           # 提交 PR 时触发构建和 Copilot 审查
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # 核心权限配置：必须有 write 才能推送 Tag 和发布 Release
    permissions:
      contents: write
      pull-requests: write 

    strategy:
      matrix:
        include:
          - os: windows-latest
            script: .\build_nuitka.bat
            asset_pattern: "dist_nuitka/TS_Dashboard.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须设为 0，否则无法获取历史标签来计算新版本号

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Build Script
        run: ${{ matrix.script }}
        env:
          NUITKA_CACHE_DISABLE: "1"

      # 第一部分：自动计算版本号并打 Tag (仅在合并到 main 且没有标签时运行)
      - name: Create Automatic Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: auto_tag
        shell: pwsh
        run: |
          # 1. 获取最新标签，如果没有则默认为 v1.0.0
          $latestTag = git describe --tags --abbrev=0 2>$null
          if ($null -eq $latestTag) { $latestTag = "v1.0.0" }
          
          # 2. 版本号自动累加 (例如 v1.0.5 -> v1.0.6)
          $version = $latestTag.TrimStart('v')
          $parts = $version.Split('.')
          $parts[2] = [int]$parts[2] + 1
          $newTag = "v" + ($parts -join '.')
          
          # 3. 推送新标签
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $newTag
          git push origin $newTag
          
          # 4. 传递给下一步
          echo "tag=$newTag" >> $env:GITHUB_OUTPUT

      # 第二部分：发布 Release (仅在有标签时运行)
      - name: Upload to Release
        # 如果是手动推的 tag，或者上一步刚自动生成的 tag，则执行发布
        if: startsWith(github.ref, 'refs/tags/') || steps.auto_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_pattern }}
          # 优先使用自动生成的 tag，否则使用当前触发的 ref_name
          tag_name: ${{ steps.auto_tag.outputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

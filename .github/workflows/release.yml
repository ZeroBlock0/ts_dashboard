name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      version: ${{ steps.semantic.outputs.version }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install --system python-semantic-release
          semantic-release --version

      - name: Semantic Release
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PAT }}
        run: |
          # Debug: Print current version and next version calculation
          echo "Debugging Semantic Release..."
          
          # Check version
          if ! try_version=$(semantic-release version --print); then
            echo "Error: semantic-release failed to determine the next version."
            echo "released=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ -z "$try_version" ]; then
            echo "No release needed (no version change detected)."
            echo "released=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Releasing version $try_version"
          echo "released=true" >> $GITHUB_OUTPUT
          echo "version=$try_version" >> $GITHUB_OUTPUT
          echo "tag=v$try_version" >> $GITHUB_OUTPUT
          
          # Run semantic-release
          semantic-release version
          semantic-release publish

  build:
    name: Build on ${{ matrix.os }}
    # Run build if release was created OR if it's a PR
    needs: release
    if: always() && (needs.release.outputs.released == 'true' || github.event_name == 'pull_request')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: ./build_windows.sh
            artifact_name: TS_Dashboard.exe
            asset_path: dist/TS_Dashboard.exe
            content_type: application/vnd.microsoft.portable-executable
          
          # - os: macos-latest
          #   script: ./build_macos.sh
          #   artifact_name: TS_Dashboard_macOS.zip
          #   asset_path: dist/TS_Dashboard_macOS.zip
          #   content_type: application/zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Application
        shell: bash
        run: ${{ matrix.script }}
        env:
          NUITKA_CACHE_DISABLE: "1"
          VERSION: ${{ needs.release.outputs.version }}

      - name: Package macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          # build_macos.sh creates TS_Dashboard.app
          zip -r TS_Dashboard_macOS.zip "TS Dashboard.app"

      - name: Upload to Release
        if: needs.release.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
          tag_name: ${{ needs.release.outputs.tag }}

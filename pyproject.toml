[project]
name = "ts-dashboard"
version = "1.1.3"
description = "TeamSpeak面板"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nuitka>=2.8.9",
    "pyside6>=6.10.1",
    "pyside6-fluent-widgets>=1.10.5",
    "websockets>=15.0.1",
    "zstandard>=0.25.0",
]

[tool.semantic_release]
version_variables = ["app/__init__.py:__version__", "pyproject.toml:version"]
upload_to_pypi = false
upload_to_release = true
build_command = "uv lock && git add uv.lock"

[tool.semantic_release.branches.main]
match = "main" 

